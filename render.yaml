# Render blueprint for the Ballistic online server (free tier). The service `name` below
# is left as-is: it's the live Render service's identity, and changing it here won't
# rename the already-provisioned service or its onrender.com hostname (see net.gd
# SERVER_URLS, which point at the current hostnames and must stay in sync with them).
# Render -> New -> Blueprint -> pick this repository. It builds the Dockerfile and
# redeploys automatically on every push.
services:
  - type: web
    name: legion-ball-server
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
